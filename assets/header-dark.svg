  <text x="440" y="21" font-size="12" fill="#8b949e" text-anchor="middle">moiz@thayer — zsh — 96x24</text><text x="22" y="62" font-size="14.5"><tspan fill="#3fb950">❯</tspan><tspan fill="#c9d1d9"> whoami</tspan></text><text x="22" y="89" font-size="14.5" fill="#c9d1d9">Muhammad Moiz  ·  Dartmouth CS '26  ·  Hartford, VT</text><text x="22" y="114" font-size="14.5"><tspan fill="#3fb950">❯</tspan><tspan fill="#c9d1d9"> cat ~/.plan</tspan></text><text x="22" y="141" font-size="14.5" fill="#8b949e">Backend &amp; distributed systems. Python/FastAPI, Postgres, async workers.</text><text x="22" y="166" font-size="14.5" fill="#8b949e">I build the part users never see and always feel.</text><text x="22" y="191" font-size="14.5"><tspan fill="#3fb950">❯</tspan><tspan fill="#c9d1d9"> echo $NEXT</tspan></text><text x="22" y="218" font-size="14.5" fill="#58a6ff">AI Infrastructure Engineering  →  make inference boring, cheap, observable</text><text x="22" y="247" font-size="14.5" fill="#3fb950">❯</text><rect id="caret" x="38" y="235" width="9" height="15" fill="#3fb950"/><style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}#caret{animation:blink 1.06s step-end infinite}</style></svg>